name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      browser:
        description: Browser project to run
        type: choice
        default: chromium
        options:
          - all
          - chromium
          - firefox
          - webkit
jobs:
  test:
    name: ${{ matrix.project }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      # one browser failing should not cancel the other two - this would hide
      # whether the failure is browser-specific
      fail-fast: false
      matrix:
        # push and pull_request gate on chromium only - it is the one project
        # that has never needed a retry. Firefox reports 1-2 flaky tests on
        # every run and webkit intermittently fails outright, so neither makes
        # a useful gate. Both stay one manual run away via workflow_dispatch.
        project: >-
          ${{ fromJSON(
            inputs.browser == 'chromium' && '["chromium"]'
            || inputs.browser == 'firefox' && '["firefox"]'
            || inputs.browser == 'webkit' && '["webkit"]'
            || inputs.browser == 'all' && '["chromium","firefox","webkit"]'
            || '["chromium"]'
          ) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # single source of truth, shared with local fnm/nvm via .nvmrc
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        # --no-shell skips the chromium-headless-shell download - we set
        # `channel: 'chromium'`, so tests run against the full browser only.
        # Firefox and Webkit jobs are unaffected.
        run: npx playwright install --with-deps --no-shell ${{ matrix.project }}
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          # unique per matrix job - upload-artifact rejects duplicate names
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
